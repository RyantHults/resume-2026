        [[params.experience.list]]
        title = "Senior Software Engineer"
        dates = " September 2025 - July 2026"
        company = "Belva"
        details = "In my time at Belva, I provided technical leadership across critical engineering initiatives, partnering with cross-functional teams to deliver scalable software, improve engineering practices, and support the organization's long-term technical strategy."
