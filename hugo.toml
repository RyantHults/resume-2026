        details = "Served as a technical leader for high-impact initiatives, resolving complex engineering challenges and mentoring teammates through difficult problems."
        [[params.experience.list.items]]
        details = "Led the rollout of organization-wide AI development practices, improving developer productivity and engineering consistency."
        [[params.experience.list.items]]
        details = "Drove product and engineering improvements by providing actionable technical guidance, influencing design decisions, and advocating for scalable solutions."

        [[params.experience.list]]
        title = "Senior Software Engineer"
        dates = "July 2021 - July 2025"
        company = "Monetate"
        details = "As a technical leader, I drove large-scale infrastructure improvements and cost-efficient optimizations while fostering cross-team collaboration to enhance system reliability and operational processes. My work involved modernizing legacy systems, mentoring engineers, and implementing best practices to elevate both technical output and organizational efficiency."
        [[params.experience.list.items]]
        details = "Led the planning and implementation of a major refactor of our AI product offering, reducing compute costs by over 20% and increasing client revenue per session by 30%. Managed team agile processes throughout the project."
        [[params.experience.list.items]]
        details = "Led the planning and execution of migrating critical components of the company's codebase from Python 2 to Python 3, ensuring compatibility and minimal disruption."
        [[params.experience.list.items]]
        details = "Led cross-team initiatives to streamline and document critical processes, enhancing operational efficiency and knowledge sharing"
        [[params.experience.list.items]]
        details = "Guided junior engineers through Python best practices and system design, improving team code quality and output."

        [[params.experience.list]]
        title = "Software Engineer"
        dates = "June 2018 - July 2021"
        company = "L3Harris Link Simulation & Training"
        details = "In this role, I contributed to the development and optimization of high-fidelity real-time flight simulators, focusing on system reliability, performance tuning, and direct customer support. My work involved enhancing back-end infrastructure, resolving critical defects, and implementing distributed simulation architectures to ensure robust and efficient training systems."
        [[params.experience.list.items]]
        details = "Design, development and debugging of high-fidelity real-time F-18 simulator."
        [[params.experience.list.items]]
        details = "Provided on-site support and de-bugging while interacting directly with customers."
